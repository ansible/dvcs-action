---
name: Unit Tests
env:
  UPSTREAM_REPOSITORY_ID: 892096292
on:
  pull_request:
  push:
jobs:
  common-tests:
    name: "Run unit tests"
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v2

      - name: Install python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install requirements
        run: pip3.11 install -r requirements_test.txt

      - name: Run 311 check
        run: tox -e 311

      - name: Inject PR number into coverage.xml
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage.xml

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Upload dvcs-action jUnit test reports to the unified dashboard
        if: >-
          !cancelled()
          && github.event_name == 'push'
          && env.UPSTREAM_REPOSITORY_ID == github.repository_id
          && github.ref_name == github.event.repository.default_branch
        uses: ansible/gh-action-record-test-results@58376e7785cbb37b4ca0c0638edf9db4e21fd0b6
        with:
          aggregation-server-url: ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_URL }}
          http-auth-password: >-
            ${{ secrets.PDE_ORG_RESULTS_UPLOAD_PASSWORD }}
          http-auth-username: >-
            ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_USER }}
          project-component-name: dvcs-action
          test-result-files: dvcs-action-test-results.xml
